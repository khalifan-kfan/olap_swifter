schema_id: clinical_visit
title: General clinical visit warehouse
study: >
  Routine facility encounters: who was seen, where and when, what they were
  diagnosed with, what was prescribed, which tests were run and the vitals
  taken. The encounter itself (length of stay, cost) is the main event.
spine:
  table: dim_visit
  key: visit_id
main_fact: fact_encounters
changelog:
- '2026-10-08: seeded from the original hard-coded constellation and sample_wide_clinical.csv'
tables:
  dim_patient:
    kind: dimension
    description: One row per person.
    key: patient_id
    synthetic: {rows: 60}
    columns:
      patient_id: {type: VARCHAR, role: key, required: true, pii: true, aliases: [subject_id, pseudo_mrn]}
      gender: {type: VARCHAR, role: attribute, aliases: [sex], allowed: [Female, Male]}
      location_district: {type: VARCHAR, role: attribute, aliases: [patient_district, home_district]}
  dim_facility:
    kind: dimension
    description: One row per health facility.
    key: facility_id
    synthetic: {rows: 7}
    columns:
      facility_id: {type: VARCHAR, role: key, required: true, aliases: [hospital_id]}
      facility_name: {type: VARCHAR, role: attribute, aliases: [hospital_name, health_facility]}
      facility_level: {type: VARCHAR, role: attribute,
                       allowed: [National Referral, Regional Referral, District Hospital, Health Center IV]}
      district: {type: VARCHAR, role: attribute, aliases: [facility_district]}
      region: {type: VARCHAR, role: attribute, aliases: [facility_region]}
  dim_visit:
    kind: dimension
    description: The spine. One row per encounter; every fact joins here.
    key: visit_id
    links: [dim_patient, dim_facility]
    columns:
      visit_id: {type: VARCHAR, role: key, required: true, aliases: [encounter_id]}
      visit_date: {type: DATE, role: attribute, required: true, aliases: [encounter_date, date_of_visit]}
      visit_type: {type: VARCHAR, role: attribute, allowed: [Outpatient, Inpatient, Emergency, Antenatal]}
      admission_ward: {type: VARCHAR, role: attribute, aliases: [ward],
                       description: "The ward as the hospital names it (kept exactly as recorded)"}
      ward_type:
        type: VARCHAR
        role: attribute
        description: Standard ward category, mapped from admission_ward through crosswalks/ward_type.yaml
        allowed: [Medical, Surgical, Paediatric, Maternity, ICU, Emergency, Outpatient, Other]
        crosswalk: {file: ward_type, from: admission_ward, scope: facility_id}
      triage_urgency: {type: VARCHAR, role: attribute, allowed: [Routine, Urgent, Emergency]}
      age_group: {type: VARCHAR, role: attribute, description: Age band at the time of the visit,
                  allowed: [0-4, 5-14, 15-24, 25-49, 50-64, 65+]}
  dim_diagnosis:
    kind: dimension
    key: diagnosis_id
    synthetic: {rows: 8}
    columns:
      diagnosis_id: {type: VARCHAR, role: key, required: true}
      diagnosis_name: {type: VARCHAR, role: attribute}
      icd10_code: {type: VARCHAR, role: attribute, aliases: [icd10, icd_code]}
      clinical_category: {type: VARCHAR, role: attribute,
                          allowed: [Infectious, Respiratory, Cardiovascular, Endocrine, Gastrointestinal]}
  dim_medication:
    kind: dimension
    key: medication_id
    synthetic: {rows: 8}
    columns:
      medication_id: {type: VARCHAR, role: key, required: true, aliases: [drug_id]}
      medication_name: {type: VARCHAR, role: attribute, aliases: [drug_name]}
      antibiotic_class: {type: VARCHAR, role: attribute, aliases: [drug_class]}
  dim_lab_test:
    kind: dimension
    key: test_id
    synthetic: {rows: 6}
    columns:
      test_id: {type: VARCHAR, role: key, required: true, aliases: [lab_id]}
      test_name: {type: VARCHAR, role: attribute}
  fact_encounters:
    kind: fact
    description: One row per visit with the encounter's own measures.
    grain: [visit_id]
    columns:
      length_of_stay_days: {type: DOUBLE, role: measure, aliases: [los, los_days], range: [0, 365]}
      encounter_cost_ugx: {type: DOUBLE, role: measure, aliases: [visit_cost, total_cost], range: [0, 50000000]}
      prior_antibiotic_use_30d: {type: VARCHAR, role: attribute, allowed: ['Yes', 'No']}
      substance_use_history: {type: VARCHAR, role: attribute, description: Substance use reported at this visit}
  fact_diagnoses:
    kind: fact
    links: [dim_diagnosis]
    grain: [visit_id, diagnosis_id]
    synthetic: {per_visit: [1, 2]}
    columns: {}
  fact_prescriptions:
    kind: fact
    links: [dim_medication]
    grain: [visit_id, medication_id]
    synthetic: {per_visit: [0, 3]}
    columns:
      drug_cost_ugx: {type: DOUBLE, role: measure, aliases: [prescription_cost], range: [0, 10000000]}
      drug_administration_route: {type: VARCHAR, role: attribute, aliases: [route], allowed: [IV, Oral, IM]}
  fact_lab_results:
    kind: fact
    links: [dim_lab_test]
    synthetic: {per_visit: [0, 2]}
    columns:
      ast_interpretation: {type: VARCHAR, role: attribute, allowed: [S, I, R]}
      zone_diameter_mm: {type: DOUBLE, role: measure, range: [0, 60]}
