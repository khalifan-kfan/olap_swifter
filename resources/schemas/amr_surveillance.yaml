schema_id: amr_surveillance
title: Antimicrobial resistance surveillance
study: >
  Laboratory AMR surveillance: isolates cultured from patient specimens during
  a visit and tested against antibiotics. The main event is one susceptibility
  test result (organism x antibiotic) with its MIC, zone diameter and S/I/R
  interpretation. Reuses the clinical visit spine, patient and facility
  dimensions and the encounter fact, so AMR joins the same constellation.
spine:
  table: dim_visit
  key: visit_id
main_fact: fact_ast_results
changelog:
- '2026-10-08: seeded from the original AMR model and sample_amr_clinical.csv'
tables:
  dim_patient:
    kind: dimension
    key: patient_id
    synthetic: {rows: 60}
    columns:
      patient_id: {type: VARCHAR, role: key, required: true, pii: true, aliases: [subject_id, pseudo_mrn]}
      gender: {type: VARCHAR, role: attribute, aliases: [sex], allowed: [Female, Male]}
      location_district: {type: VARCHAR, role: attribute, aliases: [patient_district, home_district]}
  dim_facility:
    kind: dimension
    key: facility_id
    synthetic: {rows: 7}
    columns:
      facility_id: {type: VARCHAR, role: key, required: true, aliases: [hospital_id]}
      facility_name: {type: VARCHAR, role: attribute, aliases: [hospital_name, health_facility]}
      facility_level: {type: VARCHAR, role: attribute,
                       allowed: [National Referral, Regional Referral, District Hospital, Health Center IV]}
  dim_visit:
    kind: dimension
    key: visit_id
    links: [dim_patient, dim_facility]
    columns:
      visit_id: {type: VARCHAR, role: key, required: true, aliases: [encounter_id]}
      visit_date: {type: DATE, role: attribute, required: true, aliases: [encounter_date, date_of_visit]}
      admission_ward: {type: VARCHAR, role: attribute, aliases: [ward]}
      age_group: {type: VARCHAR, role: attribute, description: Age band at the time of the visit,
                  allowed: [0-4, 5-14, 15-24, 25-49, 50-64, 65+]}
  dim_organism:
    kind: dimension
    description: One row per organism identified.
    key: organism_name
    synthetic: {rows: 6}
    columns:
      organism_name: {type: VARCHAR, role: key, required: true, aliases: [organism, isolate_organism]}
  dim_antibiotic:
    kind: dimension
    description: One row per antibiotic tested.
    key: tested_antibiotic
    synthetic: {rows: 12}
    columns:
      tested_antibiotic: {type: VARCHAR, role: key, required: true, aliases: [antibiotic, antibiotic_tested]}
      antibiotic_class: {type: VARCHAR, role: attribute, aliases: [drug_class]}
  fact_encounters:
    kind: fact
    grain: [visit_id]
    columns:
      length_of_stay_days: {type: DOUBLE, role: measure, aliases: [los, los_days], range: [0, 365]}
      encounter_cost_ugx: {type: DOUBLE, role: measure, aliases: [visit_cost, total_cost], range: [0, 50000000]}
      prior_antibiotic_use_30d: {type: VARCHAR, role: attribute, allowed: ['Yes', 'No']}
      substance_use_history: {type: VARCHAR, role: attribute, description: Substance use reported at this visit}
  fact_ast_results:
    kind: fact
    description: One antimicrobial susceptibility test result.
    links: [dim_organism, dim_antibiotic]
    grain: [visit_id, organism_name, tested_antibiotic]
    synthetic: {per_visit: [1, 3]}
    columns:
      specimen_type: {type: VARCHAR, role: attribute, aliases: [specimen, sample_type]}
      mic_ug_ml: {type: DOUBLE, role: measure, aliases: [mic], range: [0, 1024]}
      zone_diameter_mm: {type: DOUBLE, role: measure, range: [0, 60]}
      ast_interpretation: {type: VARCHAR, role: attribute, aliases: [sir], allowed: [S, I, R]}
      is_mdr_isolate: {type: BOOLEAN, role: attribute, aliases: [mdr]}
