# File routing key: where every resource lives, by name.
# Paths are relative to the repo root. The code tools resolve their paths from
# this file (olap_swifter.paths.route), so a move is one edit here.
# committed: false = git-ignored (data, or outputs of a run).

routes:
  # ---- The skill (repo root) ----
  skill:            {path: SKILL.md, committed: true, what: "The rules and the workflow the agent follows"}
  tests:            {path: TEST.md, committed: true, what: "Sub-agent test mandates and pass conditions"}
  readme:           {path: README.md, committed: true, what: "What this repo is and how to start"}

  # ---- Instructions ----
  how_to_run:       {path: resources/instructions/HOW_TO_RUN.md, committed: true, what: "Every command, file path and file format"}
  terms:            {path: resources/instructions/TERMS.md, committed: true, what: "What every term means (crosswalk, grain, gate, patch...)"}
  routes:          {path: resources/ROUTES.yaml, committed: true, what: "This file"}

  # ---- Generic settings and templates (no dataset-specific content) ----
  config:           {path: resources/config.yaml, committed: true, what: "Thresholds: match difference, EDA privacy, dummy row cap"}
  dataset_concept_template: {path: resources/templates/dataset_concept.yaml, committed: true, what: "The dataset concept: questions to ask the user about a dataset, and the sections the skill fills"}
  datasets:         {path: resources/datasets, committed: false, what: "Sample CSVs used by the code-tool tests"}
  test_fixtures:    {path: resources/code_tools/olap_swifter/tests/fixtures, committed: true, what: "Seed schemas the tests copy; never the live registry"}

  # ---- Code ----
  code_tools:       {path: resources/code_tools, committed: true, what: "Python packages, Dockerfile, pyproject"}
  packages:         {path: resources/code_tools/PACKAGES.md, committed: true, what: "Every third-party package, where it is used, and its last security audit"}
  olap_tools:       {path: resources/code_tools/olap_swifter, committed: true, what: "Warehouse: schema registry, ETL, checks, cube, reviewer, CLI"}
  privacy_tools:    {path: resources/code_tools/privacy_tools, committed: true, what: "Presidio de-identification; shared with the linked medical OCR skill"}

  # ---- Linked skills (beside this repo, not part of it) ----
  ocr_skill:        {path: ../medical_ocr_skill, committed: false, what: "Medical OCR: scanned paper forms to de-identified rows that come in here as a dataset. Its own SKILL.md, TEST.md, HOW_TO_RUN.md"}

  # ---- Results workspace: everything a run writes (never committed) ----
  # Lives outside the skill: $OLAP_SWIFTER_WORKSPACE, else results_workspace/
  # in the folder the tools run from; only when run from inside this repo
  # does it land here (git-ignored). Paths below are relative to it.
  workspace:        {path: results_workspace, committed: false, what: "The results workspace; README.md is its key"}
  workspace_readme: {path: results_workspace/README.md, committed: false, what: "The results key: where to start, the review page, the decisions made, the folder structure (rewritten by the tools)"}
  inputs:           {path: results_workspace/inputs, committed: false, what: "One folder per dataset. Put a new dataset here"}
  schemas:          {path: results_workspace/schemas, committed: false, what: "Live schema registry built from your datasets, one YAML per schema. Starts empty"}
  crosswalks:       {path: results_workspace/schemas/crosswalks, committed: false, what: "Site label -> standard category maps for the live registry"}
  warehouses:       {path: results_workspace/warehouse, committed: false, what: "The DuckDB warehouses (open read-only with `olap-swifter view`)"}
  warehouse:        {path: results_workspace/warehouse/warehouse.duckdb, committed: false, what: "Production warehouse (real data)"}
  warehouse_dummy:  {path: results_workspace/warehouse/warehouse_dummy.duckdb, committed: false, what: "Dummy warehouse (proving a schema)"}
  staging:          {path: results_workspace/warehouse/warehouse_staging.duckdb, committed: false, what: "PRIVATE: staged raw rows (the test oracle) and the key map from source identifiers to generated keys; never shared (warehouse_dummy_staging.duckdb beside it for dummy data)"}
  dummy_data:       {path: results_workspace/dummy, committed: false, what: "Dummy CSV, catalogue and EDA per schema: dummy/<schema>/"}
  dataset_outputs:  {path: results_workspace/datasets, committed: false, what: "Per dataset: constellation.md, patches/, scripts/ (ETL and processing scripts), tests/, notes"}
  token_log:        {path: results_workspace/token_log.jsonl, committed: false, what: "Size of every CLI command's output, in estimated tokens; feeds the README's token weight"}
  process_log:      {path: results_workspace/process_log.jsonl, committed: false, what: "Every tool step (counts only); feeds the review page"}
  model_reviewer:   {path: results_workspace/review/model_reviewer.html, committed: false, what: "Review page: schema art, process done so far, field mapping, checks. Rewritten by the tools after every step"}
  review:           {path: results_workspace/review, committed: false, what: "Last build summary and UI screenshots behind the review page"}
