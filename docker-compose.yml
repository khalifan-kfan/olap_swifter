version: '3.8'

services:
  olap-swifter:
    build:
      context: ./resources/code_tools
      dockerfile: Dockerfile
    image: olap-swifter:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace/resources/code_tools
    command: ["olap-swifter", "--help"]
